[project]
name = "ai-evals-starter"
version = "0.1.0"
description = "Binary LLM judge, calibration against human labels, and a CI release gate."
requires-python = ">=3.10"
dependencies = ["anthropic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
